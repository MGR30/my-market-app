spring.application.name=payment-service
server.port=8081
logging.level.ru.yandex.practicum.payment=INFO

payment.initial-balance=${PAYMENT_INITIAL_BALANCE:100000}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8082/realms/my-market}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never