spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

spring.security.oauth2.client.registration.market-app.provider=keycloak
spring.security.oauth2.client.registration.market-app.client-id=test-client
spring.security.oauth2.client.registration.market-app.client-secret=test-secret
spring.security.oauth2.client.registration.market-app.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.market-app.scope=openid
spring.security.oauth2.client.provider.keycloak.token-uri=http://localhost:9999/fake/token