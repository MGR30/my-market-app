<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Вход — Витрина магазина</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container p-5" style="max-width: 420px;">
    <h2 class="mb-4 text-center">Вход в магазин</h2>

    <div class="alert alert-danger" th:if="${error}">
        Неверный логин или пароль
    </div>
    <div class="alert alert-info" th:if="${logout}">
        Вы вышли из системы
    </div>

    <form th:action="@{/login}" method="post" class="card p-4">
        <div class="mb-3">
            <label for="username" class="form-label">Логин</label>
            <input type="text" class="form-control" id="username" name="username" required autofocus/>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Пароль</label>
            <input type="password" class="form-control" id="password" name="password" required/>
        </div>
        <button type="submit" class="btn btn-primary">Войти</button>
        <a href="/items" class="btn btn-link mt-2">← На главную</a>
    </form>

    <p class="text-muted mt-3 text-center small">
        Тестовые пользователи: <code>user1/password1</code>, <code>user2/password2</code>
    </p>
</div>
</body>
</html>
