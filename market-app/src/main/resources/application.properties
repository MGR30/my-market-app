spring.application.name=my-market-app
server.port=${SERVER_PORT:8080}
spring.profiles.default=h2
spring.thymeleaf.cache=false
spring.codec.max-in-memory-size=20MB
logging.level.ru.yandex.practicum.mymarket=INFO
payment.service.url=${PAYMENT_SERVICE_URL:http://localhost:8081}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
cache.items.ttl-seconds=120
management.endpoints.web.exposure.include=health
spring.security.oauth2.client.registration.market-app.provider=keycloak
spring.security.oauth2.client.registration.market-app.client-id=${OAUTH2_CLIENT_ID:market-app}
spring.security.oauth2.client.registration.market-app.client-secret=${OAUTH2_CLIENT_SECRET:market-app-secret}
spring.security.oauth2.client.registration.market-app.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.market-app.scope=openid
spring.security.oauth2.client.provider.keycloak.token-uri=${KEYCLOAK_TOKEN_URI:http://localhost:8082/realms/my-market/protocol/openid-connect/token}